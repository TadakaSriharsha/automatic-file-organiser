<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>FileFlow — Smart File Organizer</title>
  <link rel="stylesheet" href="/auth.css">
</head>
<body>
  <main class="auth-shell">
    <section class="landing-shell">
      <div class="landing-copy">
        <div class="brand-row"><span class="brand-mark">FF</span><span class="brand-name">File<span>Flow</span></span></div>
        <span class="auth-kicker">PRIVATE SMART WORKSPACE</span>
        <h1>Every file,<br><span>exactly in place.</span></h1>
        <p>Organize uploads, find files instantly, and keep every workspace private. FileFlow combines a clean file manager with secure personal storage.</p>
        <div class="landing-actions">
          <a class="auth-button" href="/signin" style="display:grid;place-items:center;text-decoration:none">Sign in</a>
          <a class="auth-button secondary" href="/signup" style="display:grid;place-items:center;text-decoration:none">Create account</a>
        </div>
      </div>
      <div class="landing-preview" aria-hidden="true">
        <div class="preview-window">
          <div class="preview-bar"><i></i><i></i><i></i></div>
          <div class="preview-content">
            <div class="preview-side"><span></span><span></span><span></span><span></span></div>
            <div class="preview-main">
              <h3>Workspace overview</h3>
              <div class="preview-stats"><div></div><div></div><div></div></div>
              <div class="preview-files"><div></div><div></div><div></div></div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
