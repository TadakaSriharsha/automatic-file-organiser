<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Forgot password — FileFlow</title><link rel="stylesheet" href="/auth.css"></head>
<body><main class="auth-shell"><section class="auth-card">
  <div class="brand-row"><span class="brand-mark">FF</span><span class="brand-name">File<span>Flow</span></span></div>
  <span class="auth-kicker">ACCOUNT RECOVERY</span><h1>Forgot password?</h1><p class="auth-copy">Enter your email and we’ll send reset instructions if an account exists.</p>
  <div class="auth-alert" id="alert"></div>
  <form id="forgotForm"><div class="field"><label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="email" required></div><button class="auth-button" id="submitButton" type="submit">Send reset link</button></form>
  <div class="auth-divider"></div><p class="auth-footer"><a class="auth-link" href="/signin">← Back to Sign in</a></p>
</section></main>
<script>
const form=document.getElementById("forgotForm"),alertBox=document.getElementById("alert"),button=document.getElementById("submitButton");
form.addEventListener("submit",async event=>{event.preventDefault();if(button.disabled)return;button.disabled=true;button.textContent="Sending…";const data=Object.fromEntries(new FormData(form));try{const response=await fetch("/api/auth/forgot-password",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(data)});const result=await response.json();alertBox.textContent=result.message||"If an account exists with this email, you'll receive a password reset link shortly.";alertBox.className="auth-alert success";form.reset();}catch(error){alertBox.textContent="Unable to process the request.";alertBox.className="auth-alert error";}finally{button.disabled=false;button.textContent="Send reset link";}});
</script></body></html>
